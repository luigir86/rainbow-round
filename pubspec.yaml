name: rainbow_round
description: "Rainbow Round: a circle of eight coloured notes to play, listen and repeat."
publish_to: 'none'

# The number after the + is the Android versionCode: it must grow with every
# upload to Google Play.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_soloud: ^5.2.1
  shared_preferences: ^2.5.6

# The Xiph libraries (Ogg, Vorbis, Opus, libFLAC) are left out of the audio
# engine, as in Low End: the piano notes are short WAV files, which need no
# codec and are served as they are by the web version too.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: any

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/piano/
    - assets/fonts/OFL-Edwin.txt

  # Edwin, the font of Low End.
  fonts:
    - family: Edwin
      fonts:
        - asset: assets/fonts/Edwin-Roman.otf
          weight: 400
        - asset: assets/fonts/Edwin-Bold.otf
          weight: 700
